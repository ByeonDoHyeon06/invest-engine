[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-engine"
version = "0.0.1"
description = "Broker-independent event-driven trading engine (E0 foundations only)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "invest-engine contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["invest_engine"]
warn_unused_ignores = true

[project.scripts]
invest-engine = "invest_engine.cli:main"
