name: Alpaca five-year adjusted daily strategy study

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/alpaca_daily_strategy_panel.py
      - .github/workflows/alpaca-daily-strategy-panel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-alpaca-market-data
  cancel-in-progress: false

jobs:
  annual:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/alpaca-daily-strategy-panel')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . exchange-calendars==4.13.1
      - name: Read-only data retrieval and research proxy replay
        env:
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_DATA_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_DATA_SECRET }}
          PANEL_YEAR: ${{ matrix.year }}
        run: python -u scripts/alpaca_daily_strategy_panel.py "$PANEL_YEAR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-adjusted-daily-study-${{ matrix.year }}
          path: research-output/alpaca-adjusted-daily-*
          if-no-files-found: error
          retention-days: 7
