name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/e514b-dated-cost-audit, feat/e515b-independent-provider, feat/e62-durable-research-registry, feat/e63-walk-forward, feat/e63b-fold-execution, feat/e64-market-regime, feat/e65a-bounded-parameter-search, feat/e65b-search-lineage]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev,data]"
      - name: Static style
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: python -m pytest -q
      - name: Basic secrets guard
        run: python scripts/check_secrets.py
