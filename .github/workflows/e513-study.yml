name: E5.13 provisional market study

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/e513_market_study.py'
      - '.github/workflows/e513-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -u scripts/e513_market_study.py daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e513-daily-summary
          path: research-output/
  minute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        symbol: [TSLA, SPY, KO, TWTR]
        month: [9, 10, 11]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -u scripts/e513_market_study.py minute ${{ matrix.symbol }} ${{ matrix.month }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e513-minute-${{ matrix.symbol }}-${{ matrix.month }}-summary
          path: research-output/
