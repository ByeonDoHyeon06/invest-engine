name: Alpaca turnover temporal expansion 2023

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/alpaca_reduced_turnover.py
      - scripts/alpaca_raw_minute_pilot.py
      - tests/test_turnover_temporal_panel.py
      - src/invest_engine/strategies/orb_screen.py
      - tests/test_orb_e4.py
      - .github/workflows/alpaca-turnover-temporal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-alpaca-temporal-2023-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minute:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/e66-temporal-expansion')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol: [AAPL, MSFT, NVDA, TSLA, AMZN, GOOG]
        month: [1, 4, 7, 10]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . exchange-calendars==4.13.1 pytest
      - run: python -m pytest -q tests/test_alpaca_action_screen.py tests/test_orb_e4.py tests/test_turnover_temporal_panel.py
      - name: Read-only raw minute research
        env:
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_DATA_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_DATA_SECRET }}
          PANEL_SYMBOL: ${{ matrix.symbol }}
          PANEL_MONTH: ${{ matrix.month }}
        run: python -u scripts/alpaca_reduced_turnover.py "$PANEL_SYMBOL" "$PANEL_MONTH" --year 2023
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-turnover-2023-${{ matrix.symbol }}-${{ matrix.month }}
          path: research-output/alpaca-reduced-turnover-2023-*
          if-no-files-found: error
          retention-days: 7
